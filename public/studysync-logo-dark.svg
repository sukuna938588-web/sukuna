<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" fill="none">
  <defs>
    <linearGradient id="dark-ribbon-main" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="dark-cyan-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <linearGradient id="dark-text-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="dark-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="dark-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ==================== SYMBOL (LEFT) ==================== -->
  <g transform="translate(4, 2)">
    <!-- Ambient Neon Aura -->
    <circle cx="55" cy="55" r="44" fill="#4F46E5" opacity="0.22" filter="url(#dark-glow)" />
    <circle cx="55" cy="55" r="32" fill="#06B6D4" opacity="0.18" filter="url(#dark-glow)" />

    <!-- Connected Student Collaboration Network -->
    <g opacity="0.9">
      <!-- Synaptic Connection Arcs -->
      <path d="M 16,36 Q 28,30 38,36" stroke="#06B6D4" stroke-width="1.3" stroke-dasharray="2.5 2" stroke-opacity="0.8" />
      <path d="M 94,32 Q 82,38 72,36" stroke="#A78BFA" stroke-width="1.3" stroke-dasharray="2.5 2" stroke-opacity="0.8" />
      <path d="M 14,76 Q 26,82 38,76" stroke="#22D3EE" stroke-width="1.3" stroke-dasharray="2.5 2" stroke-opacity="0.8" />
      <path d="M 96,78 Q 84,72 74,78" stroke="#C084FC" stroke-width="1.3" stroke-dasharray="2.5 2" stroke-opacity="0.8" />
      <!-- Constellation Ring -->
      <path d="M 16,36 C 6,56 6,66 14,76" stroke="#6366F1" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.5" />
      <path d="M 94,32 C 104,52 104,64 96,78" stroke="#06B6D4" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.5" />

      <!-- Student & Tutor Nodes with Glowing Rings -->
      <circle cx="16" cy="36" r="6" fill="#4F46E5" fill-opacity="0.4" />
      <circle cx="16" cy="36" r="3.2" fill="#06B6D4" filter="url(#dark-glow)" />
      <circle cx="16" cy="36" r="1.3" fill="#FFFFFF" />

      <circle cx="94" cy="32" r="6" fill="#7C3AED" fill-opacity="0.4" />
      <circle cx="94" cy="32" r="3.2" fill="#A78BFA" filter="url(#dark-glow)" />
      <circle cx="94" cy="32" r="1.3" fill="#FFFFFF" />

      <circle cx="14" cy="76" r="6" fill="#06B6D4" fill-opacity="0.4" />
      <circle cx="14" cy="76" r="3.2" fill="#22D3EE" filter="url(#dark-glow)" />
      <circle cx="14" cy="76" r="1.3" fill="#FFFFFF" />

      <circle cx="96" cy="78" r="6" fill="#9333EA" fill-opacity="0.4" />
      <circle cx="96" cy="78" r="3.2" fill="#C084FC" filter="url(#dark-glow)" />
      <circle cx="96" cy="78" r="1.3" fill="#FFFFFF" />
    </g>

    <!-- 3D Ribbon Letter "S" -->
    <g filter="url(#dark-shadow)">
      <path
        d="M 68,28 C 68,28 42,23 32,33 C 22,43 24,56 38,62 C 48,66 60,68 56,79 C 52,90 38,92 27,85 C 23,82.5 21,78 21,78"
        stroke="url(#dark-ribbon-main)"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <path
        d="M 64,29 C 45,25 35,33 34,42 C 33,51 44,57 52,61 C 60,65 65,71 62,80 C 58,88 47,89 33,85"
        stroke="url(#dark-specular)"
        stroke-width="2.5"
        stroke-linecap="round"
        fill="none"
      />

      <path
        d="M 66,28 C 42,24 33,35 34,44 C 35,53 47,59 55,63 C 64,68 67,76 63,84 C 58,91 44,92 29,86"
        stroke="#FFFFFF"
        stroke-width="1"
        stroke-linecap="round"
        stroke-opacity="0.6"
        fill="none"
      />
    </g>

    <!-- Embedded AI Circuit Traces with High-Luminescence -->
    <g opacity="1">
      <path d="M 40,78 L 48,78 L 54,72 L 66,72" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="66" cy="72" r="2.4" fill="#22D3EE" filter="url(#dark-glow)" />
      <circle cx="66" cy="72" r="1.1" fill="#FFFFFF" />

      <path d="M 36,85 L 46,85 L 53,92 L 59,92" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="59" cy="92" r="1.8" fill="#67E8F9" />

      <path d="M 46,78 L 46,85" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round" />
      <circle cx="46" cy="78" r="1.3" fill="#38BDF8" />
      <circle cx="46" cy="85" r="1.3" fill="#38BDF8" />

      <circle cx="51" cy="75" r="1.2" fill="#22D3EE" />
      <circle cx="38" cy="82" r="1.2" fill="#67E8F9" />
    </g>

    <!-- Academic Graduation Cap at Top Crest -->
    <g transform="translate(0, 0)">
      <polygon points="54,7 76,16 54,25 32,16" fill="#4F46E5" stroke="#A5B4FC" stroke-width="1" />
      <polygon points="54,7 76,16 54,25 32,16" fill="url(#dark-ribbon-main)" opacity="0.8" />
      <polyline points="32,16 54,7 76,16" stroke="#FFFFFF" stroke-width="1.4" fill="none" opacity="0.85" />
      <path d="M 40,19.5 L 54,25 L 68,19.5 L 68,23.5 L 54,28.5 L 40,23.5 Z" fill="#312E81" />
      <ellipse cx="54" cy="16" rx="2" ry="1.4" fill="#FFFFFF" />
      <!-- Flowing Tassel -->
      <path d="M 54,16 C 64,17 73,22 75,29 C 76,33 75,38 73,43" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" fill="none" />
      <circle cx="73" cy="43" r="2.5" fill="#22D3EE" filter="url(#dark-glow)" />
      <circle cx="73" cy="43" r="1" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY (DARK THEME) ==================== -->
  <g transform="translate(132, 28)">
    <text
      x="0"
      y="42"
      font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
      font-size="44"
      font-weight="800"
      letter-spacing="-0.03em"
      fill="#FFFFFF"
    >
      Study<tspan fill="#818CF8">Sync</tspan>
    </text>

    <!-- AI Badge -->
    <g transform="translate(232, 10)">
      <rect x="0" y="0" width="58" height="42" rx="12" fill="#1E1B4B" fill-opacity="0.8" />
      <rect x="0" y="0" width="58" height="42" rx="12" stroke="url(#dark-cyan-pulse)" stroke-width="1.4" />
      <text
        x="29"
        y="30"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
        font-size="24"
        font-weight="900"
        letter-spacing="0.04em"
        fill="url(#dark-text-ai)"
        filter="url(#dark-glow)"
      >
        AI
      </text>
    </g>

    <text
      x="2"
      y="66"
      font-family="'Inter', -apple-system, sans-serif"
      font-size="10.5"
      font-weight="600"
      letter-spacing="0.22em"
      fill="#94A3B8"
    >
      INTELLIGENT PEER TUTOR MATCHING
    </text>

    <line x1="2" y1="74" x2="72" y2="74" stroke="url(#dark-cyan-pulse)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
