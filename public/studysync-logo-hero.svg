<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 130" fill="none">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="hero-ribbon-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Cyan Pulse Accent -->
    <linearGradient id="hero-cyan-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="hero-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- AI Gradient -->
    <linearGradient id="hero-ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hero-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="hero-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ==================== HERO EMBLEM (LEFT) ==================== -->
  <g transform="translate(6, 6)">
    <!-- Deep Ambient Glow Orb -->
    <circle cx="60" cy="60" r="50" fill="#4F46E5" opacity="0.18" filter="url(#hero-glow)" />
    <circle cx="60" cy="60" r="36" fill="#06B6D4" opacity="0.15" filter="url(#hero-glow)" />

    <!-- Connected Student Collaboration Network -->
    <g opacity="0.9">
      <path d="M 18,38 Q 30,32 40,38" stroke="#06B6D4" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.75" />
      <path d="M 102,34 Q 90,40 80,38" stroke="#818CF8" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.75" />
      <path d="M 16,84 Q 28,90 40,84" stroke="#22D3EE" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.75" />
      <path d="M 104,86 Q 92,80 82,86" stroke="#C084FC" stroke-width="1.4" stroke-dasharray="3 2" stroke-opacity="0.75" />

      <!-- Constellation Ring -->
      <path d="M 18,38 C 7,60 7,72 16,84" stroke="#6366F1" stroke-width="1" stroke-dasharray="2.5 3.5" stroke-opacity="0.45" />
      <path d="M 102,34 C 113,56 113,70 104,86" stroke="#06B6D4" stroke-width="1" stroke-dasharray="2.5 3.5" stroke-opacity="0.45" />

      <!-- Student & Tutor Satellite Nodes -->
      <circle cx="18" cy="38" r="6" fill="#4F46E5" fill-opacity="0.3" />
      <circle cx="18" cy="38" r="3.4" fill="#06B6D4" filter="url(#hero-glow)" />
      <circle cx="18" cy="38" r="1.3" fill="#FFFFFF" />

      <circle cx="102" cy="34" r="6" fill="#7C3AED" fill-opacity="0.3" />
      <circle cx="102" cy="34" r="3.4" fill="#818CF8" filter="url(#hero-glow)" />
      <circle cx="102" cy="34" r="1.3" fill="#FFFFFF" />

      <circle cx="16" cy="84" r="6" fill="#06B6D4" fill-opacity="0.3" />
      <circle cx="16" cy="84" r="3.4" fill="#22D3EE" filter="url(#hero-glow)" />
      <circle cx="16" cy="84" r="1.3" fill="#FFFFFF" />

      <circle cx="104" cy="86" r="6" fill="#9333EA" fill-opacity="0.3" />
      <circle cx="104" cy="86" r="3.4" fill="#C084FC" filter="url(#hero-glow)" />
      <circle cx="104" cy="86" r="1.3" fill="#FFFFFF" />
    </g>

    <!-- 3D Ribbon Letter "S" -->
    <g filter="url(#hero-drop-shadow)">
      <path
        d="M 74,30 C 74,30 46,25 35,35 C 24,46 26,60 41,67 C 52,71 65,73 61,85 C 57,97 42,99 29,92 C 25,89 23,84 23,84"
        stroke="url(#hero-ribbon-grad)"
        stroke-width="12.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Specular Highlight Ribbon Bevel -->
      <path
        d="M 70,31 C 49,27 38,35 37,45 C 36,55 48,61 57,66 C 65,70 70,77 67,86 C 63,95 51,96 36,92"
        stroke="url(#hero-specular)"
        stroke-width="2.8"
        stroke-linecap="round"
        fill="none"
      />

      <path
        d="M 72,30 C 46,26 36,37 37,47 C 38,57 51,63 60,68 C 70,73 73,82 69,90 C 63,98 48,99 31,93"
        stroke="#FFFFFF"
        stroke-width="1"
        stroke-linecap="round"
        stroke-opacity="0.6"
        fill="none"
      />
    </g>

    <!-- AI Circuit Traces Embedded in Lower S Curve -->
    <g opacity="0.95">
      <path d="M 44,84 L 52,84 L 59,78 L 72,78" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="72" cy="78" r="2.2" fill="#22D3EE" filter="url(#hero-glow)" />
      <circle cx="72" cy="78" r="1.1" fill="#FFFFFF" />

      <path d="M 39,92 L 50,92 L 58,99 L 64,99" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="64" cy="99" r="1.8" fill="#67E8F9" />

      <path d="M 50,84 L 50,92" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round" />
      <circle cx="50" cy="84" r="1.3" fill="#38BDF8" />
      <circle cx="50" cy="92" r="1.3" fill="#38BDF8" />

      <circle cx="55" cy="81" r="1.2" fill="#22D3EE" />
      <circle cx="42" cy="88" r="1.2" fill="#67E8F9" />
    </g>

    <!-- Academic Graduation Cap at Top Crest -->
    <g transform="translate(0, 0)">
      <polygon points="59,8 83,18 59,28 35,18" fill="#4F46E5" stroke="#818CF8" stroke-width="1.1" />
      <polygon points="59,8 83,18 59,28 35,18" fill="url(#hero-ribbon-grad)" opacity="0.8" />
      <polyline points="35,18 59,8 83,18" stroke="#C7D2FE" stroke-width="1.4" fill="none" opacity="0.9" />
      <path d="M 44,21.5 L 59,27.5 L 74,21.5 L 74,26 L 59,31.5 L 44,26 Z" fill="#312E81" />
      <ellipse cx="59" cy="18" rx="2.2" ry="1.5" fill="#FFFFFF" />
      <!-- Flowing Tassel -->
      <path d="M 59,18 C 70,19 80,24 82,32 C 83,36 82,42 80,47" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" fill="none" />
      <circle cx="80" cy="47" r="2.5" fill="#22D3EE" filter="url(#hero-glow)" />
      <circle cx="80" cy="47" r="1" fill="#FFFFFF" />
    </g>
  </g>

  <!-- ==================== HERO TYPOGRAPHY (RIGHT) ==================== -->
  <g transform="translate(148, 30)">
    <!-- Wordmark -->
    <text
      x="0"
      y="48"
      font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
      font-size="52"
      font-weight="800"
      letter-spacing="-0.035em"
      fill="#0F172A"
      class="hero-wordmark"
    >
      Study<tspan fill="#4F46E5">Sync</tspan>
    </text>

    <!-- AI Badge -->
    <g transform="translate(276, 12)">
      <rect x="0" y="0" width="68" height="48" rx="14" fill="url(#hero-ribbon-grad)" opacity="0.12" />
      <rect x="0" y="0" width="68" height="48" rx="14" stroke="url(#hero-cyan-pulse)" stroke-width="1.5" />
      <text
        x="34"
        y="34"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
        font-size="28"
        font-weight="900"
        letter-spacing="0.04em"
        fill="url(#hero-ai-grad)"
        filter="url(#hero-glow)"
      >
        AI
      </text>
    </g>

    <!-- Subtitle & Category -->
    <text
      x="2"
      y="76"
      font-family="'Inter', -apple-system, sans-serif"
      font-size="11.5"
      font-weight="700"
      letter-spacing="0.25em"
      fill="#64748B"
      class="hero-subtitle"
    >
      ENTERPRISE PEER TUTOR MATCHING PLATFORM
    </text>

    <line x1="2" y1="86" x2="90" y2="86" stroke="url(#hero-cyan-pulse)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <style>
    @media (prefers-color-scheme: dark) {
      .hero-wordmark { fill: #FFFFFF !important; }
      .hero-subtitle { fill: #94A3B8 !important; }
    }
  </style>
</svg>
