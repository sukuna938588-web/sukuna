<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient Mesh -->
    <radialGradient id="icon-bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Master Ribbon Gradient -->
    <linearGradient id="icon-ribbon" x1="15%" y1="12%" x2="85%" y2="88%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="icon-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="icon-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="icon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="icon-ambient-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#icon-bg)" filter="url(#icon-ambient-shadow)" />
  <!-- Glass Rim Highlight -->
  <rect x="4" y="4" width="120" height="120" rx="30" stroke="url(#icon-border)" stroke-width="1.8" />

  <!-- Internal Ambient Radial Light Spot -->
  <circle cx="64" cy="40" r="40" fill="#4F46E5" opacity="0.25" filter="url(#icon-glow)" />
  <circle cx="64" cy="85" r="32" fill="#06B6D4" opacity="0.2" filter="url(#icon-glow)" />

  <!-- Collaborative Student Network Nodes and Synapses -->
  <g opacity="0.9">
    <path d="M 22,46 Q 34,40 44,46" stroke="#06B6D4" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.75" />
    <path d="M 106,42 Q 94,48 84,46" stroke="#A78BFA" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.75" />
    <path d="M 20,88 Q 32,94 44,88" stroke="#22D3EE" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.75" />
    <path d="M 108,90 Q 96,84 86,90" stroke="#C084FC" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.75" />

    <!-- Outer Nodes -->
    <circle cx="22" cy="46" r="3" fill="#06B6D4" filter="url(#icon-glow)" />
    <circle cx="22" cy="46" r="1.2" fill="#FFFFFF" />

    <circle cx="106" cy="42" r="3" fill="#A78BFA" filter="url(#icon-glow)" />
    <circle cx="106" cy="42" r="1.2" fill="#FFFFFF" />

    <circle cx="20" cy="88" r="3" fill="#22D3EE" filter="url(#icon-glow)" />
    <circle cx="20" cy="88" r="1.2" fill="#FFFFFF" />

    <circle cx="108" cy="90" r="3" fill="#C084FC" filter="url(#icon-glow)" />
    <circle cx="108" cy="90" r="1.2" fill="#FFFFFF" />
  </g>

  <!-- 3D Ribbon Letter "S" Symbol (Centered in 128x128) -->
  <g transform="translate(10, 8)">
    <!-- Main Upper & Lower Arc of S -->
    <path
      d="M 68,28 C 68,28 42,23 32,33 C 22,43 24,56 38,62 C 48,66 60,68 56,79 C 52,90 38,92 27,85 C 23,82.5 21,78 21,78"
      stroke="url(#icon-ribbon)"
      stroke-width="12"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#icon-glow)"
    />

    <!-- Specular Highlight Ribbon Bevel -->
    <path
      d="M 64,29 C 45,25 35,33 34,42 C 33,51 44,57 52,61 C 60,65 65,71 62,80 C 58,88 47,89 33,85"
      stroke="url(#icon-specular)"
      stroke-width="2.6"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Embedded AI Circuit Traces -->
    <g>
      <path d="M 40,78 L 48,78 L 54,72 L 66,72" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="66" cy="72" r="2.2" fill="#22D3EE" filter="url(#icon-glow)" />
      <circle cx="66" cy="72" r="1" fill="#FFFFFF" />

      <path d="M 36,85 L 46,85 L 53,92 L 59,92" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="59" cy="92" r="1.8" fill="#67E8F9" />

      <path d="M 46,78 L 46,85" stroke="#38BDF8" stroke-width="1.3" stroke-linecap="round" />
      <circle cx="46" cy="78" r="1.3" fill="#38BDF8" />
      <circle cx="46" cy="85" r="1.3" fill="#38BDF8" />
    </g>

    <!-- Integrated Academic Graduation Cap -->
    <g>
      <polygon points="54,7 76,16 54,25 32,16" fill="#4F46E5" stroke="#A5B4FC" stroke-width="1" />
      <polygon points="54,7 76,16 54,25 32,16" fill="url(#icon-ribbon)" opacity="0.75" />
      <polyline points="32,16 54,7 76,16" stroke="#FFFFFF" stroke-width="1.4" fill="none" opacity="0.9" />
      <path d="M 40,19.5 L 54,25 L 68,19.5 L 68,23.5 L 54,28.5 L 40,23.5 Z" fill="#312E81" />
      <ellipse cx="54" cy="16" rx="2" ry="1.4" fill="#FFFFFF" />
      <!-- Flowing Tassel -->
      <path d="M 54,16 C 64,17 73,22 75,29 C 76,33 75,38 73,43" stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" fill="none" />
      <circle cx="73" cy="43" r="2.4" fill="#22D3EE" filter="url(#icon-glow)" />
      <circle cx="73" cy="43" r="1" fill="#FFFFFF" />
    </g>
  </g>
</svg>
