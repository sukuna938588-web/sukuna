<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Brand Gradient: Indigo -> Violet -> Cyan -->
    <linearGradient id="fav-ribbon" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="48%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Cyan Accent -->
    <linearGradient id="fav-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.45" />
    </filter>

    <radialGradient id="fav-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="1" />
    </radialGradient>
  </defs>

  <!-- Background Squircle for high legibility in browser tabs -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)" />
  <rect width="64" height="64" rx="16" stroke="#312E81" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Collaborative Peer Nodes and Connecting Synapses -->
  <g opacity="0.8">
    <path d="M 12,24 Q 18,20 25,25" stroke="#06B6D4" stroke-width="1" stroke-dasharray="1.5 1.5" stroke-opacity="0.7" />
    <path d="M 52,20 Q 46,24 40,23" stroke="#818CF8" stroke-width="1" stroke-dasharray="1.5 1.5" stroke-opacity="0.7" />
    <path d="M 12,46 Q 19,48 24,45" stroke="#06B6D4" stroke-width="1" stroke-dasharray="1.5 1.5" stroke-opacity="0.7" />
    <path d="M 52,48 Q 46,45 38,48" stroke="#38BDF8" stroke-width="1" stroke-dasharray="1.5 1.5" stroke-opacity="0.7" />

    <!-- Peer Nodes -->
    <circle cx="12" cy="24" r="2.2" fill="#06B6D4" filter="url(#fav-glow)" />
    <circle cx="52" cy="20" r="2.2" fill="#818CF8" />
    <circle cx="12" cy="46" r="2" fill="#38BDF8" />
    <circle cx="52" cy="48" r="2.2" fill="#06B6D4" filter="url(#fav-glow)" />
  </g>

  <!-- Futuristic "S" Ribbon Body -->
  <!-- Top Loop -->
  <path
    d="M 43,21.5 C 43,21.5 31,18 24,24 C 18,29 18,37 27,40 C 35,43 45,44 43,51 C 41,57 32,59 23,55 C 20,53.5 18,50 18,50"
    stroke="url(#fav-ribbon)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#fav-glow)"
  />

  <!-- Specular inner ribbon core -->
  <path
    d="M 41,22.5 C 34,19.5 26,22 23,26 C 20,30 22,35 29,38 C 36,41 43,43 41,49 C 39,54 32,56 25,53"
    stroke="#E0E7FF"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-opacity="0.7"
  />

  <!-- Embedded AI Circuit Traces in lower sweep -->
  <path d="M 28,49 L 33,49 L 36,52" stroke="#22D3EE" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="36" cy="52" r="1.1" fill="#22D3EE" />
  <path d="M 32,45 L 36,45 L 39,42" stroke="#67E8F9" stroke-width="1" stroke-linecap="round" />
  <circle cx="39" cy="42" r="0.9" fill="#67E8F9" />

  <!-- Integrated Academic Graduation Cap at Top Crest -->
  <g transform="translate(0, -1)">
    <!-- Cap Diamond / Mortarboard -->
    <polygon points="33,8 45,13 33,18 21,13" fill="#6366F1" stroke="#A5B4FC" stroke-width="0.8" />
    <polygon points="33,8 45,13 33,18 21,13" fill="url(#fav-cyan)" opacity="0.3" />
    <!-- Cap skullcap base -->
    <path d="M 26,15.5 Q 33,19 40,15.5 L 40,17 Q 33,20.5 26,17 Z" fill="#4338CA" />
    <!-- Tassel Button & Cord with Cyan Glow -->
    <circle cx="33" cy="13" r="1" fill="#FFFFFF" />
    <path d="M 33,13 Q 39,14 41,18 Q 42,21 41,23" stroke="#22D3EE" stroke-width="0.9" stroke-linecap="round" fill="none" />
    <circle cx="41" cy="23" r="1" fill="#22D3EE" filter="url(#fav-glow)" />
  </g>
</svg>
