<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" fill="none">
  <defs>
    <linearGradient id="light-ribbon-main" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="50%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <linearGradient id="light-cyan-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="light-text-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <filter id="light-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4338CA" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- ==================== SYMBOL (LEFT) ==================== -->
  <g transform="translate(4, 2)">
    <!-- Ambient Subdued Tint -->
    <circle cx="55" cy="55" r="42" fill="#EEF2FF" />

    <!-- Connected Student Collaboration Network -->
    <g opacity="0.95">
      <path d="M 16,36 Q 28,30 38,36" stroke="#0891B2" stroke-width="1.3" stroke-dasharray="2.5 2" stroke-opacity="0.75" />
      <path d="M 94,32 Q 82,38 72,36" stroke="#6D28D9" stroke-width="1.3" stroke-dasharray="2.5 2" stroke-opacity="0.75" />
      <path d="M 14,76 Q 26,82 38,76" stroke="#0284C7" stroke-width="1.3" stroke-dasharray="2.5 2" stroke-opacity="0.75" />
      <path d="M 96,78 Q 84,72 74,78" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="2.5 2" stroke-opacity="0.75" />

      <!-- Student & Tutor Nodes -->
      <circle cx="16" cy="36" r="4.5" fill="#E0E7FF" />
      <circle cx="16" cy="36" r="2.8" fill="#0891B2" />

      <circle cx="94" cy="32" r="4.5" fill="#EDE9FE" />
      <circle cx="94" cy="32" r="2.8" fill="#6D28D9" />

      <circle cx="14" cy="76" r="4.5" fill="#E0F2FE" />
      <circle cx="14" cy="76" r="2.8" fill="#0284C7" />

      <circle cx="96" cy="78" r="4.5" fill="#F3E8FF" />
      <circle cx="96" cy="78" r="2.8" fill="#7C3AED" />
    </g>

    <!-- 3D Ribbon Letter "S" -->
    <g filter="url(#light-shadow)">
      <path
        d="M 68,28 C 68,28 42,23 32,33 C 22,43 24,56 38,62 C 48,66 60,68 56,79 C 52,90 38,92 27,85 C 23,82.5 21,78 21,78"
        stroke="url(#light-ribbon-main)"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Specular Highlight Ribbon Bevel -->
      <path
        d="M 64,29 C 45,25 35,33 34,42 C 33,51 44,57 52,61 C 60,65 65,71 62,80 C 58,88 47,89 33,85"
        stroke="#FFFFFF"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-opacity="0.8"
        fill="none"
      />
    </g>

    <!-- AI Circuit Traces Embedded in Lower S Curve -->
    <g>
      <path d="M 40,78 L 48,78 L 54,72 L 66,72" stroke="#0891B2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="66" cy="72" r="2.2" fill="#0891B2" />

      <path d="M 36,85 L 46,85 L 53,92 L 59,92" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="59" cy="92" r="1.8" fill="#0284C7" />

      <path d="M 46,78 L 46,85" stroke="#0891B2" stroke-width="1.2" stroke-linecap="round" />
      <circle cx="46" cy="78" r="1.2" fill="#0891B2" />
      <circle cx="46" cy="85" r="1.2" fill="#0891B2" />
    </g>

    <!-- Academic Graduation Cap at Top Crest -->
    <g transform="translate(0, 0)">
      <polygon points="54,7 76,16 54,25 32,16" fill="#4338CA" stroke="#312E81" stroke-width="0.8" />
      <polyline points="32,16 54,7 76,16" stroke="#C7D2FE" stroke-width="1.4" fill="none" />
      <path d="M 40,19.5 L 54,25 L 68,19.5 L 68,23.5 L 54,28.5 L 40,23.5 Z" fill="#312E81" />
      <ellipse cx="54" cy="16" rx="2" ry="1.4" fill="#FFFFFF" />
      <path d="M 54,16 C 64,17 73,22 75,29 C 76,33 75,38 73,43" stroke="#0891B2" stroke-width="1.6" stroke-linecap="round" fill="none" />
      <circle cx="73" cy="43" r="2.2" fill="#0891B2" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY (LIGHT THEME) ==================== -->
  <g transform="translate(132, 28)">
    <text
      x="0"
      y="42"
      font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif"
      font-size="44"
      font-weight="800"
      letter-spacing="-0.03em"
      fill="#0F172A"
    >
      Study<tspan fill="#4338CA">Sync</tspan>
    </text>

    <!-- AI Badge -->
    <g transform="translate(232, 10)">
      <rect x="0" y="0" width="58" height="42" rx="12" fill="#EEF2FF" />
      <rect x="0" y="0" width="58" height="42" rx="12" stroke="url(#light-text-ai)" stroke-width="1.4" />
      <text
        x="29"
        y="30"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
        font-size="24"
        font-weight="900"
        letter-spacing="0.04em"
        fill="url(#light-text-ai)"
      >
        AI
      </text>
    </g>

    <text
      x="2"
      y="66"
      font-family="'Inter', -apple-system, sans-serif"
      font-size="10.5"
      font-weight="700"
      letter-spacing="0.22em"
      fill="#475569"
    >
      INTELLIGENT PEER TUTOR MATCHING
    </text>

    <line x1="2" y1="74" x2="72" y2="74" stroke="url(#light-cyan-pulse)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
